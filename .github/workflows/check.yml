name: 书源检测

on:
  schedule:
    - cron: "0 22 * * *" # 每天北京时间 6:00
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "tools/**"
      - "all.json"
      - ".github/workflows/check.yml"

permissions:
  contents: write # 自动维护要提交改动
  issues: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 自动维护提交前要 pull --rebase

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: 安装依赖
        run: pip install -r tools/requirements.txt

      - name: all.json 是否最新
        run: python tools/build.py --check

      - name: 逐个测试书源
        id: test
        run: |
          set +e
          python tools/test_source.py all.json --summary summary.md --json results.json 2>&1 | tee log.txt
          code=${PIPESTATUS[0]}
          {
            echo "## 书源检测结果"
            echo
            cat summary.md
            echo
            echo "<details><summary>完整日志</summary>"
            echo
            echo '```'
            cat log.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # 只在每天的定时检测里做，这样「连续 2 次失败」就是连续 2 天
      - name: 自动维护（停用 / 恢复 / 换域名）
        if: github.event_name == 'schedule'
        run: |
          touch maint.md
          python tools/maintain.py results.json --today "$(TZ=Asia/Shanghai date +%F)" \
            --report maint.md --commit-msg msg.txt 2>&1 | tee maint_log.txt
          if [ -s maint.md ]; then
            { echo "## 自动维护"; echo; cat maint.md; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # 每次检测完都提交一次：更新 STATUS.md、追加 reports/history.jsonl，连同自动维护的改动一起推送
      - name: 写检测记录并推送
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python tools/report.py results.json --maint maint.md --trigger "${{ github.event_name }}" \
            --run-url "$RUN_URL" --commit-msg msg.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          all_changed=$(git status --porcelain all.json)
          git add -A STATUS.md reports sources all.json tools/keywords.json
          git add -A status.json 2>/dev/null || true
          git commit -m "$(cat msg.txt)"
          git pull --rebase origin main
          git push origin HEAD:main
          # all.json 有变化时，让备用地址（jsDelivr）马上拿到新版本
          if [ -n "$all_changed" ]; then
            curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/all.json" || true
          fi

      - name: 有书源失效时开 issue
        if: steps.test.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          touch maint.md
          body="$(cat summary.md)

          $(if [ -s maint.md ]; then printf '**自动维护**\n\n'; cat maint.md; fi)

          详细日志：$RUN_URL"
          num=$(gh issue list --state open --search "书源检测失败 in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "书源检测失败" --body "$body"
          fi
          exit 1

      - name: 全部通过时关闭 issue
        if: steps.test.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          num=$(gh issue list --state open --search "书源检测失败 in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue close "$num" --comment "$(date -u +%F) 检测全部通过，自动关闭。"
          fi
