name: 书源检测

on:
  schedule:
    - cron: "0 22 * * *" # 每天北京时间 6:00
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "tools/**"
      - "all.json"
      - ".github/workflows/check.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: 安装依赖
        run: pip install -r tools/requirements.txt

      - name: all.json 是否最新
        run: python tools/build.py --check

      - name: 逐个测试书源
        id: test
        run: |
          set +e
          python tools/test_source.py all.json --summary summary.md 2>&1 | tee log.txt
          code=${PIPESTATUS[0]}
          {
            echo "## 书源检测结果"
            echo
            cat summary.md
            echo
            echo "<details><summary>完整日志</summary>"
            echo
            echo '```'
            cat log.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 有书源失效时开 issue
        if: steps.test.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$(cat summary.md)

          详细日志：$RUN_URL"
          num=$(gh issue list --state open --search "书源检测失败 in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "书源检测失败" --body "$body"
          fi
          exit 1

      - name: 全部通过时关闭 issue
        if: steps.test.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          num=$(gh issue list --state open --search "书源检测失败 in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue close "$num" --comment "$(date -u +%F) 检测全部通过，自动关闭。"
          fi
