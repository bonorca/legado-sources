name: 书源检测

on:
  schedule:
    - cron: "0 13 * * *" # 每天 UTC-7 早上 6:00（UTC 13:00）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "tools/**"
      - "all.json"
      - ".github/workflows/check.yml"

permissions:
  contents: write # 自动维护要提交改动

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 自动维护提交前要 pull --rebase

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: 安装依赖
        run: pip install -r tools/requirements.txt

      - name: all.json 是否最新
        run: python tools/build.py --check

      - name: 逐个测试书源
        run: |
          set +e
          python tools/test_source.py all.json --summary summary.md --json results.json 2>&1 | tee log.txt
          {
            echo "## 书源检测结果"
            echo
            cat summary.md
            echo
            echo "<details><summary>完整日志</summary>"
            echo
            echo '```'
            cat log.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # 只在每天的定时检测里做，这样「连续 2 次失败」就是连续 2 天
      - name: 自动维护（停用 / 恢复 / 换域名）
        if: github.event_name == 'schedule'
        run: |
          touch maint.md
          python tools/maintain.py results.json --today "$(TZ=Etc/GMT+7 date +%F)" \
            --report maint.md --commit-msg msg.txt 2>&1 | tee maint_log.txt
          if [ -s maint.md ]; then
            { echo "## 自动维护"; echo; cat maint.md; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # 每次检测完都提交一次：更新 README 底部的书源状态、追加 reports/history.jsonl，连同自动维护的改动一起推送
      # 有书源没通过也不把这次运行标成失败（免得天天收邮件），结果看 README
      - name: 写检测记录并推送
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch msg.txt && cp msg.txt maint_msg.txt
          all_changed=$(git status --porcelain all.json)
          # 检测期间 main 上可能又多了提交（别的检测、手动推送）。不合并 README，
          # 而是每次都切到最新的 main、把自动维护的改动放回去，再重新生成 README 和记录
          for try in 1 2 3; do
            git stash push -u -q -- sources all.json status.json tools/keywords.json || true
            git fetch -q origin main
            git reset -q --hard origin/main
            git stash pop -q 2>/dev/null || true
            cp maint_msg.txt msg.txt
            python tools/report.py results.json --maint maint.md --trigger "${{ github.event_name }}" \
              --run-url "$RUN_URL" --commit-msg msg.txt
            git add -A README.md reports sources all.json tools/keywords.json
            git add -A status.json 2>/dev/null || true
            git commit -q -m "$(cat msg.txt)"
            if git push -q origin HEAD:main; then break; fi
            [ "$try" = 3 ] && exit 1
            git reset -q --soft HEAD~1 && git restore -q --staged . && git checkout -q -- README.md reports
            sleep 5
          done
          # all.json 有变化时，让备用地址（jsDelivr）马上拿到新版本
          if [ -n "$all_changed" ]; then
            curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/all.json" || true
          fi
